</span>
    <button class="sharebtn" id="shareBtn" onclick="shareBoard()">📤 Chia sẻ</button>
    <button class="eyebtn" id="eyeBtn" onclick="toggleShareBtn()" title="Bật/tắt nút Chia sẻ">👁️</button>
  </div>
</div>
<script>
function shareBoard(){
  var url='https://kevinsea9-dev.github.io/bang-market-live/';
  var data={title:'📊 Bảng Market Live — Iggy × Tom',text:'Bảng market live: tin tức, vùng giá, tín hiệu vùng — cập nhật 10 lần/ngày',url:url};
  if(navigator.share){navigator.share(data).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){alert('Đã copy link bảng — dán gửi cho bạn bè là xong!');});}
  else{prompt('Copy link này để chia sẻ:',url);}
}
function applySharePref(){
  var show=localStorage.getItem('boardShowShare');
  if(show===null) show='1';
  var b=document.getElementById('shareBtn');
  var e=document.getElementById('eyeBtn');
  if(b) b.style.display=(show==='1')?'':'none';
  if(e) e.textContent=(show==='1')?'👁️':'🚫';
}
function toggleShareBtn(){
  var show=localStorage.getItem('boardShowShare');
  if(show===null) show='1';
  localStorage.setItem('boardShowShare', show==='1'?'0':'1');
  applySharePref();
}
applySharePref();
// PIN GATE — khóa mã vào cửa (khóa lịch sự, chống người tò mò)
var BOARD_PIN='7563';
function checkPin(){
  var v=document.getElementById('pinInput').value.trim();
  if(v===BOARD_PIN){
    localStorage.setItem('boardPinOk','1');
    document.getElementById('pinGate').style.display='none';
  }else{
    document.getElementById('pinErr').textContent='Mã chưa đúng — thử lại nhé';
    document.getElementById('pinInput').value='';
  }
}
(function(){
  if(localStorage.getItem('boardPinOk')==='1'){
    var g=document.getElementById('pinGate');
    if(g) g.style.display='none';
  }else{
    var inp=document.getElementById('pinInput');
    if(inp) inp.addEventListener('keydown',function(e){if(e.key==='Enter')checkPin();});
  }
})();
</script>
